name: Tarefa
description: Criar uma tarefa técnica ou funcional para o projeto
title: "[TAREFA] "
labels: []
body:
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Qual problema precisa ser resolvido?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo
      description: Descreva a entrega esperada.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: study
    attributes:
      label: Estudo necessário
      description: Conceitos que precisam ser aprendidos antes ou durante a tarefa.
  - type: textarea
    id: tests
    attributes:
      label: Testes esperados
      description: Cenários felizes, erros e regras que precisam de cobertura.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependências
      description: Issues, decisões ou entregas necessárias antes desta tarefa.
